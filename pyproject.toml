[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listinglens"
version = "0.1.0"
description = "Flags inconsistent claims and suspicious signals in marketplace listings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",  # eBay descriptions are HTML; checks need plain text
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
listinglens = "listinglens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import sorting, B = common bug patterns, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]
